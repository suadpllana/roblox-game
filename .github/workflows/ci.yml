name: CI

on:
  push:
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo and luau-lsp
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip
          unzip -o -q rojo.zip -d "$HOME/bin"
          curl -sSL -o lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/latest/download/luau-lsp-linux-x86_64.zip
          unzip -o -q lsp.zip -d "$HOME/bin"
          curl -sSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau
          chmod +x "$HOME/bin/"*
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Type check
        run: |
          rojo sourcemap default.project.json -o sourcemap.json
          output=$(luau-lsp analyze --definitions=globalTypes.d.luau --sourcemap=sourcemap.json src 2>&1 | grep -v "^\[INFO\]\|^\[WARN\] client" || true)
          echo "$output"
          test -z "$output"

      - name: Build place file
        run: rojo build default.project.json -o StealAPlushie.rbxlx

      - uses: actions/upload-artifact@v4
        with:
          name: StealAPlushie
          path: StealAPlushie.rbxlx
